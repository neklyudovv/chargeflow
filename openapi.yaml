openapi: 3.1.0
info:
  title: Chargeflow API
  version: 1.0.0
paths:
  /api/v1/api-keys/:
    get:
      operationId: listApiKeys
      summary: List active API keys
      parameters:
      - in: header
        name: X-Organization-Id
        schema:
          type: integer
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: scope
        schema:
          enum:
          - read
          - read_write
          type: string
          minLength: 1
      tags:
      - API keys
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
              examples:
                Example:
                  value:
                    next: null
                    previous: null
                    results:
                    - id: 1
                      name: Reporting
                      prefix: cf_example
                      created_at: '2030-01-15T12:00:00Z'
                      expires_at: null
                      revoked: false
                      scope: read
          description: OK
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    code: method_not_allowed
                    message: Method is not allowed.
                    fields: {}
          description: Method Not Allowed
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    code: not_acceptable
                    message: Could not satisfy the request Accept header.
                    fields: {}
          description: Not Acceptable
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    code: internal_error
                    message: An unexpected server error occurred.
                    fields: {}
          description: Internal Server Error
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    code: validation_error
                    message: Request validation failed.
                    fields:
                      non_field_errors:
                      - Invalid request.
          description: Bad Request
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    code: throttled
                    message: Request was throttled.
                    fields: {}
          description: Too Many Requests
        '401':
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
