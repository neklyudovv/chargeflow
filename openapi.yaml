          format: date-time
          readOnly: true
        revoked:
          type: boolean
          readOnly: true
        scope:
          allOf:
          - $ref: '#/components/schemas/ApiKeyScopeEnum'
          readOnly: true
        key:
          type: string
      required:
      - created_at
      - expires_at
      - id
      - key
      - name
      - prefix
      - revoked
      - scope
    ApiKeyPage:
      type: object
      required:
      - next
      - previous
      - results
      properties:
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
