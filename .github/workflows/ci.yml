name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chargeflow
          POSTGRES_USER: chargeflow
          POSTGRES_PASSWORD: chargeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargeflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-insecure-test-key
      WEBHOOK_SECRET: ci-webhook-test-key
      DJANGO_DEBUG: "True"
      CELERY_TASK_ALWAYS_EAGER: "True"
      POSTGRES_DB: chargeflow
      POSTGRES_USER: chargeflow
      POSTGRES_PASSWORD: chargeflow
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chargeflow
          POSTGRES_USER: chargeflow
          POSTGRES_PASSWORD: chargeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargeflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: ci-insecure-test-key
      WEBHOOK_SECRET: ci-webhook-test-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: chargeflow
      POSTGRES_USER: chargeflow
      POSTGRES_PASSWORD: chargeflow
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/0
      REDIS_THROTTLE_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Start worker
        run: celery -A config worker -Q io,batch --loglevel=info --concurrency=1 > worker.log 2>&1 &

      - name: Run the billing chain through the worker
        run: python scripts/e2e_chain.py
        env:
          PYTHONPATH: .

      - name: Worker log
        if: always()
        run: cat worker.log

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated stack
        run: |
          cp .env.example .env
          python - <<'PY'
          import secrets
          from pathlib import Path
          p = Path('.env')
          text = p.read_text()
          for name in ('DJANGO_SECRET_KEY', 'WEBHOOK_SECRET', 'POSTGRES_PASSWORD'):
              text = text.replace(name + '=\n', name + '=' + secrets.token_hex(32) + '\n')
          p.write_text(text)
          PY
      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify runtime and billing
        run: |
          docker compose exec -T backend python -c "import os, importlib.util; assert os.getuid() != 0; assert importlib.util.find_spec('pytest') is None"
          docker compose exec -T backend python scripts/e2e_chain.py
          docker compose exec -T backend python manage.py makemigrations --check --dry-run
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes
